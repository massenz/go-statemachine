name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Go toolchain
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          fsm-cli/go.sum
    - name: Install YQ
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq &&\
          sudo chmod +x /usr/bin/yq
    - name: Generate Certs
      run: |
        tool_dir="$RUNNER_TEMP/cfssl-tools"
        mkdir -p "$tool_dir/bin"
        for tool in cfssl cfssljson; do
          curl --fail --location --proto '=https' --proto-redir '=https' \
            "https://github.com/cloudflare/cfssl/releases/download/v1.7.2/${tool}_1.7.2_linux_amd64" \
            --output "$tool_dir/${tool}_1.7.2_linux_amd64"
        done
        (cd "$tool_dir" && sha256sum --check "$GITHUB_WORKSPACE/.github/cfssl-checksums.txt")
        for tool in cfssl cfssljson; do
          install -m 755 "$tool_dir/${tool}_1.7.2_linux_amd64" "$tool_dir/bin/$tool"
        done
        PATH="$tool_dir/bin:$PATH" make certs
    - name: Build Container
      run: |
        make container
    - name: Test Server
      run: |
        mkdir -p ${HOME}/.aws && cp data/credentials ${HOME}/.aws/
        export AWS_REGION=us-west-2
        go test ./pkg/api ./pkg/grpc ./pkg/pubsub ./pkg/storage
    - name: Build and check CLI
      run: |
        make cli
        cd fsm-cli
        go test ./... -run '^$'
        go vet ./...

