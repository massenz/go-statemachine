name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Go toolchain
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          fsm-cli/go.sum
    - name: Install YQ
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq &&\
          sudo chmod +x /usr/bin/yq
    - name: Generate Certs
      run: |
        export GOPATH=/opt/go
        mkdir -p $GOPATH/bin
        export PATH=$GOPATH/bin:$PATH
        go install -mod=readonly github.com/cloudflare/cfssl/cmd/cfssl@v1.6.3
        go install -mod=readonly github.com/cloudflare/cfssl/cmd/cfssljson@v1.6.3
        make certs
    - name: Build Container
      run: |
        make container
    - name: Test Server
      run: |
        mkdir -p ${HOME}/.aws && cp data/credentials ${HOME}/.aws/
        export AWS_REGION=us-west-2
        go test ./pkg/api ./pkg/grpc ./pkg/pubsub ./pkg/storage
    - name: Build and check CLI
      run: |
        make cli
        cd fsm-cli
        go test ./... -run '^$'
        go vet ./...

